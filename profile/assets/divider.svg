<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 20" width="1280" height="20" role="img" aria-labelledby="t d"><title id="t">Divisória</title><desc id="d">Linha fina cinza com um vértice laranja andando por ela.</desc><style>@keyframes walk{from{transform:translateX(-560px)}to{transform:translateX(560px)}}.walk{animation:walk 9s ease-in-out -4.5s infinite alternate}@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}.ring{animation:ring 3.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs></defs>
<line x1="80" y1="10" x2="1200" y2="10" stroke="#8B8B8B" stroke-opacity=".5" stroke-width="1.5" stroke-linecap="round"/>
<circle cx="80" cy="10" r="2.6" fill="#8B8B8B" fill-opacity=".7"/>
<circle cx="1200" cy="10" r="2.6" fill="#8B8B8B" fill-opacity=".7"/>
<g class="walk"><circle class="ring" cx="640" cy="10" r="3.6" fill="none" stroke="#FF5A1F" stroke-width="1.2" opacity="0"/><circle cx="640" cy="10" r="3.6" fill="#FF5A1F"/></g>
</svg>
